name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find Gradle Wrapper
      run: |
        echo "Mencari file gradlew..."

        GRADLEW=$(find . -type f -name gradlew -not -path "*/.git/*" -print -quit)

        if [ -z "$GRADLEW" ]; then
          echo "ERROR: File gradlew tidak ditemukan!"
          echo "Pastikan proyek memiliki Gradle Wrapper."
          exit 1
        fi

        PROJECT_DIR=$(dirname "$GRADLEW")

        echo "Gradle ditemukan: $GRADLEW"
        echo "Folder proyek: $PROJECT_DIR"

        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Build Debug APK
      run: |
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ModeDesktop-Debug-APK
        path: '**/build/outputs/apk/debug/*.apk'
        if-no-files-found: error
